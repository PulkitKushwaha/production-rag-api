name: CI/CD Pipeline
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
jobs:
 
  # ── Job 1: Test ──────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
 
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
 
      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci-only
          ALLOWED_API_KEYS: test-key-1,test-key-2
        run: |
          python -m pytest tests/ -v --tb=short
 
      - name: Verify app starts
        env:
          SECRET_KEY: test-secret-key-for-ci-only
          ALLOWED_API_KEYS: test-key-1
        run: |
          python -c "from app.main import create_app; app = create_app(); print('App created successfully')"
 
  # ── Job 2: Lint ──────────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install linting tools
        run: pip install flake8 black isort
 
      - name: Check formatting
        run: black --check app/ tests/
        continue-on-error: true
 
      - name: Check imports
        run: isort --check-only app/ tests/
        continue-on-error: true
 
      - name: Lint
        run: |
          flake8 app/ tests/ \
            --max-line-length=100 \
            --ignore=E203,W503
        continue-on-error: true
 
  # ── Job 3: Docker Build ──────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          target: production
          push: false
          tags: production-rag-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
 
      - name: Test Docker image starts
        run: |
          docker run --rm -d \
            --name test-container \
            -p 8000:8000 \
            -e SECRET_KEY=test-secret \
            -e ALLOWED_API_KEYS=test-key \
            production-rag-api:${{ github.sha }}
 
          # Wait for container to be healthy
          sleep 10
 
          # Check health endpoint
          curl -f http://localhost:8000/api/v1/health || exit 1
 
          docker stop test-container
          echo "Docker image verified successfully"
 
  # ── Job 4: Security Scan ─────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install safety
        run: pip install safety bandit
 
      - name: Check dependencies for vulnerabilities
        run: safety check -r requirements.txt
        continue-on-error: true
 
      - name: Static security analysis
        run: |
          bandit -r app/ \
            --severity-level medium \
            --confidence-level medium \
            -f txt
        continue-on-error: true
